version: "3.9"

services:
  web:
    build: .
    container_name: shptodxf_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # lokalni folder sa SHP/DXF fajlovima mountovan u kontejner
      - .:/app             # mount ceo projekat da možeš menjati kod bez rebuild
